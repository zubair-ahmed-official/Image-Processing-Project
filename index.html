<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
<img id="processed" width="640" />

<p>Status: <span id="status">Disconnected</span></p>
<p>Faces: <span id="faces">0</span></p>
<p>Emotion: <span id="emotion">none</span></p>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const processed = document.getElementById("processed");
const statusEl = document.getElementById("status");
const facesEl = document.getElementById("faces");
const emotionEl = document.getElementById("emotion");

const protocol = location.protocol === "https:" ? "wss:" : "ws:";
const socket = new WebSocket(`${protocol}//${location.host}/ws`);

socket.onopen = async () => {
  statusEl.textContent = "Connected";

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 },
    audio: false
  });

  video.srcObject = stream;

  setInterval(sendFrame, 150); // about 6–7 FPS
};

socket.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.type === "processed_frame") {
    processed.src = "data:image/jpeg;base64," + data.image;
    facesEl.textContent = data.faces_count;
    emotionEl.textContent = data.emotion;
  }
};

function sendFrame() {
  if (socket.readyState !== WebSocket.OPEN) return;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const image = canvas.toDataURL("image/jpeg", 0.65);

  socket.send(JSON.stringify({
    type: "camera_frame",
    image: image
  }));
}
</script>
